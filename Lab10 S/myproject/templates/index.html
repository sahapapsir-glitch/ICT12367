<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .btn-center {
            text-align: center;
        }
        .btn-pink {
            background-color: pink !important;
            color: white !important;
            border: none;
        }
        .btn-orange {
            background-color: orange !important;
            color: white !important;
            border: none;
        }
        .table-hover tbody tr:hover {
            background-color: #f5f5f5;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Person List</h1>
    <table class="table table-hover">
        <thead>
            <tr>
                <th>id</th>
                <th>Name</th>
                <th>Age</th>
                <th>Date</th>
                <th>แก้ไข</th>
                <th>ลบ</th>
            </tr>
        </thead>
        <tbody>
            {% for person in all_persons %}
            <tr>
                <td>{{ person.id }}</td>
                <td>{{ person.name }}</td>
                <td>{{ person.age }}</td>
                <td>{{ person.date }}</td>
                <td class="btn-center"><a href="/edit/{{ person.id }}" class="btn btn-pink">แก้ไข</a></td>
                <td class="btn-center"><a href="/delete/{{ person.id }}" class="btn btn-orange">ลบ</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
