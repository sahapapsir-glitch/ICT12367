{% extends "Base.html" %}

{% block title %}
<title>เกี่ยวกับเรา</title>
{% endblock %}

{% block content %}
<style>
  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --brand:#6f42c1;
  }
  body{ background: var(--bg); }

  .page-wrap{
    max-width: 980px;
    margin: 18px auto 28px;
    padding: 0 14px;
  }

  /* Banner */
  .banner{
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 28px rgba(0,0,0,.12);
    background: #000;
    transform: perspective(1000px) rotateX(1deg);
    transition: all 0.6s ease;
  }
  .banner:hover {
    transform: perspective(1000px) rotateX(0deg) scale(1.02);
    box-shadow: 0 20px 40px rgba(0,0,0,.2);
  }
  .banner img{
    width: 100%;
    height: 260px;
    object-fit: cover;
    opacity: .9;
    transition: all 0.6s ease;
  }
  .banner:hover img {
    opacity: 1;
    transform: scale(1.05);
    filter: brightness(1.1);
  }
  .banner::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(0deg, rgba(0,0,0,.55), rgba(0,0,0,.15));
    transition: all 0.6s ease;
  }
  .banner:hover::after {
    background: linear-gradient(0deg, rgba(0,0,0,.45), rgba(0,0,0,.05));
  }
  .banner-text{
    position:absolute; inset:0;
    z-index: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 16px;
    color:#fff;
    font-weight: 800;
    text-shadow: 0 2px 10px rgba(0,0,0,.35);
    font-size: clamp(18px, 3vw, 28px);
    transition: all 0.6s ease;
  }
  .banner:hover .banner-text {
    transform: translateY(-3px);
    text-shadow: 0 4px 20px rgba(0,0,0,.5);
  }

  /* Section title */
  .section-title{
    margin: 16px 0 10px;
    text-align:center;
    color: var(--text);
    font-weight: 800;
  }
  .section-sub{
    text-align:center;
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* Gallery card */
  .gallery-card{
    background: var(--card);
    border: 1px solid rgba(17,24,39,.08);
    border-radius: 12px;
    box-shadow: 0 10px 24px rgba(0,0,0,.06);
    padding: 16px;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }
  .gallery-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.8s ease;
    z-index: 1;
  }
  .gallery-card:hover::before {
    left: 100%;
  }
  .gallery-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0,0,0,.12);
  }
  .gallery-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 768px){
    .gallery-grid{ grid-template-columns: repeat(2, 1fr); }
    .banner img{ height: 220px; }
  }
  @media (max-width: 420px){
    .gallery-grid{ grid-template-columns: 1fr; }
  }

  .gimg{
    width:100%;
    height: 110px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid rgba(17,24,39,.10);
    transition: all 0.4s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .gimg::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
    opacity: 0;
    transition: all 0.4s ease;
  }
  .gimg:hover::before {
    opacity: 1;
  }
  .gimg:hover{
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 15px 30px rgba(0,0,0,.15);
    z-index: 10;
  }
  .gimg:nth-child(1) { transition-delay: 0.1s; }
  .gimg:nth-child(2) { transition-delay: 0.2s; }
  .gimg:nth-child(3) { transition-delay: 0.3s; }
  .gimg:nth-child(4) { transition-delay: 0.4s; }
  .gimg:nth-child(5) { transition-delay: 0.5s; }
  .gimg:nth-child(6) { transition-delay: 0.6s; }
  .gimg:nth-child(7) { transition-delay: 0.7s; }
  .gimg:nth-child(8) { transition-delay: 0.8s; }
  .gimg:nth-child(9) { transition-delay: 0.9s; }

  .footer-dark{
    margin-top: 18px;
    background:#111827;
    color:#e5e7eb;
    padding: 14px 0;
    text-align:center;
    font-size: .92rem;
  }
</style>

<div class="page-wrap">

  <!-- Banner เหมือนในรูป -->
  <div class="banner fade-in">
    <!-- เปลี่ยนเป็นรูปของคุณได้ -->
    <img src="https://cdn.pixabay.com/photo/2025/09/27/19/17/milky-way-9859259_960_720.jpg" alt="banner">
    <div class="banner-text">
      ยินดีต้อนรับสู่เว็บไซต์ของรายวิชา ICT12367
    </div>
  </div>

  <!-- หัวข้อกลาง -->
  <h3 class="section-title scroll-reveal">ภาพกิจกรรม</h3>
  <div class="section-sub scroll-reveal">รวมภาพบรรยากาศและกิจกรรมของเรา</div>

  <!-- กล่องแกลเลอรี่ -->
  <div class="gallery-card scroll-reveal">
    <div class="gallery-grid">
      <!-- เปลี่ยน src เป็นรูปของคุณ หรือใช้ไฟล์ใน static ได้ -->
      <img class="gimg" src="https://images.unsplash.com/photo-1511920170033-f8396924c348?w=900&q=80&auto=format&fit=crop" alt="">
      <img class="gimg" src="https://images.unsplash.com/photo-1459755486867-b55449bb39ff?w=900&q=80&auto=format&fit=crop" alt="">
      <img class="gimg" src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=900&q=80&auto=format&fit=crop" alt="">

      <img class="gimg" src="https://images.unsplash.com/photo-1445116572660-236099ec97a0?w=900&q=80&auto=format&fit=crop" alt="">
      <img class="gimg" src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=900&q=80&auto=format&fit=crop" alt="">
      <img class="gimg" src="https://images.unsplash.com/photo-1504754524776-8f4f37790ca0?w=900&q=80&auto=format&fit=crop" alt="">

      <img class="gimg" src="https://images.unsplash.com/photo-1761839271800-f44070ff0eb9?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
      <img class="gimg" src="https://images.unsplash.com/photo-1497501917125-1d703ac4a255?q=80&w=708&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
      <img class="gimg" src="https://images.unsplash.com/photo-1546549032-9571cd6b27df?w=900&q=80&auto=format&fit=crop" alt="">
    </div>
  </div>

</div>

<div class="footer-dark">
  &copy; 2026 ICT12367 SPU | Information Technology
</div>
{% endblock %}
